<body>
  <a class="skip" href="#main" data-i18n="skip">Saltar al contenido</a>
  <header class="top">
    <a class="brand" href="/"><img class="brand-mark" src="/assets/logo/b87-mark.svg" alt="" width="30" height="30">Buski<span>87</span></a>
    <nav aria-label="Principal">
      <a href="/" data-i18n="nav_home">Inicio</a>
      <a href="/juegos" data-i18n="nav_games">Juegos</a>
      <a href="/web" data-i18n="nav_web">Web</a>
      <a href="/contacto" data-i18n="nav_contact" aria-current="page">Contacto</a>
      <button id="lang" class="lang" aria-label="Language">EN</button>
    </nav>
  </header>

  <main id="main">
    <section id="contacto" class="contact page-hero">
      <h1 data-i18n="contact_title">Hablemos de tu proyecto</h1>
      <p class="sub" data-i18n="contact_sub">Cuéntanos qué necesitas: un juego o una web. Te respondemos en 24-48 h.</p>
      <form id="cform" class="cform" method="post" action="/404.html">
        <div class="f-row">
          <label><span data-i18n="f_name">Nombre</span>
            <input type="text" name="name" required autocomplete="name" maxlength="80"></label>
          <label><span data-i18n="f_email">Tu email</span>
            <input type="email" name="email" required autocomplete="email" maxlength="120"></label>
        </div>
        <label><span data-i18n="f_phone">Teléfono</span>
          <input type="tel" name="telefono" id="f-phone" required autocomplete="tel" inputmode="tel" maxlength="20" pattern="[0-9+()\s.\-]{6,20}" placeholder="+34 600 000 000"></label>
        <label><span data-i18n="f_area">¿Qué te interesa?</span>
          <select name="area" id="f-area"></select></label>
        <div id="game-fields" class="game-fields" hidden>
          <label><span data-i18n="f_pack">Paquete de interés</span>
            <select name="pack" id="f-pack"></select></label>
          <label><span data-i18n="f_mode">Estilo gráfico</span>
            <select name="mode" id="f-mode"></select></label>
        </div>
        <div id="web-fields" class="game-fields" hidden>
          <label><span data-i18n="f_service">¿Qué necesitas?</span>
            <select name="servicio" id="f-service"></select></label>
          <label><span data-i18n="f_webtype">Tipo de web</span>
            <select name="tipo_de_web" id="f-webtype"></select></label>
          <label id="f-weburl-wrap" hidden><span data-i18n="f_weburl">Dirección de tu web actual</span>
            <input type="text" name="web_actual" id="f-weburl" maxlength="200" autocomplete="url" inputmode="url" placeholder="https://…"></label>
          <label><span data-i18n="f_deadline">Plazo deseado</span>
            <select name="plazo" id="f-deadline"></select></label>
        </div>
        <label><span data-i18n="f_msg">Cuéntanos qué necesitas</span>
          <textarea name="message" id="f-msg" rows="6" required maxlength="3000"></textarea></label>
        <label class="consent"><input type="checkbox" name="consent" id="f-consent" required>
          <span data-i18n="f_consent">Acepto que usen mis datos solo para responder a mi consulta.</span></label>
        <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
        <button class="btn primary" id="f-btn" type="submit" data-i18n="f_send">Enviar mensaje</button>
        <p class="f-status" id="f-status" role="status" aria-live="polite"></p>
      </form>
      <noscript><p class="f-status err">Para enviar el formulario necesitas activar JavaScript. También puedes escribirnos por WhatsApp o a buski1987@gmail.com. / To send the form you need to enable JavaScript. You can also reach us on WhatsApp or at buski1987@gmail.com.</p></noscript>
      <div class="cta center">
        <a class="btn wa" id="wa" href="#" target="_blank" rel="noopener noreferrer">💬 <span data-i18n="contact_wa">Escribir por WhatsApp</span></a>
      </div>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> Buski87 · buski87.dev · <a href="/privacidad" data-i18n="footer_priv">Política de privacidad</a> · <a href="/aviso-legal" data-i18n="footer_legal">Aviso legal</a></p>
  </footer>

  <script src="/assets/app.js?v=20261118m"></script>
